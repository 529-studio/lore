name: Lore memory
description: Ingest the repository, diff memory against the base branch, and comment on the pull request.
author: 529 Studio
branding:
  icon: archive
  color: gray-dark

inputs:
  github-token:
    description: Token used to post or update the pull request comment.
    required: true
  base-ref:
    description: Branch the pull request targets.
    required: false
    default: main
  lore-ref:
    description: Git ref of the Lore CLI to build when lore-version is empty.
    required: false
    default: v0.4.0
  lore-version:
    description: Published version to install from npm instead of building from source.
    required: false
    default: ''
  hub-url:
    description: lore-hub URL. When set, the action pulls the shared team baseline before diffing.
    required: false
    default: ''
  hub-token:
    description: Token for hub-url. Store it as a secret; never commit it.
    required: false
    default: ''
  strict:
    description: Fail the check when memory health crosses the threshold.
    required: false
    default: 'false'
  max-claims:
    description: Maximum added claims listed in the comment.
    required: false
    default: '15'

outputs:
  added:
    description: Number of claims this pull request adds.
    value: ${{ steps.report.outputs.added }}
  stale:
    description: Number of claims invalidated by this pull request.
    value: ${{ steps.report.outputs.stale }}
  team-stale:
    description: Number of invalidated claims that were taught by a teammate or agent.
    value: ${{ steps.report.outputs.team_stale }}

runs:
  using: composite
  steps:
    - name: Install Lore from npm
      if: inputs.lore-version != ''
      shell: bash
      run: npm install --global "@529studio/lore@${{ inputs.lore-version }}"

    - name: Build and link the CLI from source
      if: inputs.lore-version == ''
      shell: bash
      env:
        LORE_REF: ${{ inputs.lore-ref }}
      run: |
        set -euo pipefail
        # A local action (`uses: ./.github/actions/lore`) must exercise the
        # checked-out CLI, or a PR that changes the action would run it against
        # an older release that lacks its JSON commands.
        if [ -n "${GITHUB_ACTION_PATH:-}" ] && [[ "${GITHUB_ACTION_PATH}" == "${GITHUB_WORKSPACE}/"* ]]; then
          echo "local action: building the CLI from ${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          npm ci --no-audit --no-fund
          npm run build
          npm link
          exit 0
        fi
        # Remote action: cloned outside the caller workspace, since
        # actions/checkout refuses paths outside it and a tool checkout inside
        # the workspace would be ingested as claims.
        git clone --depth 1 --branch "${LORE_REF}" https://github.com/529-studio/lore.git "${RUNNER_TEMP}/lore-tool"
        cd "${RUNNER_TEMP}/lore-tool"
        npm ci --no-audit --no-fund
        npm run build
        npm link

    - name: Restore the base memory cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/lore-base/.lore
        key: lore-base-${{ github.event.pull_request.base.sha || inputs.base-ref }}

    - name: Build the base memory
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        set -euo pipefail
        if [ -f "${RUNNER_TEMP}/lore-base/.lore/lore.db" ]; then
          echo "base memory restored from cache"
        else
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}" 2>/dev/null || git rev-parse "${BASE_REF}")"
          git worktree add "${RUNNER_TEMP}/lore-base" "${BASE_SHA}"
          (
            cd "${RUNNER_TEMP}/lore-base"
            # A linked worktree otherwise shares the primary checkout's store;
            # the base memory must be isolated and copied into the workspace.
            export LORE_STATE_DIR="${RUNNER_TEMP}/lore-base/.lore"
            LORE_SESSION=base lore init > /dev/null
            LORE_SESSION=base lore ingest > /dev/null
            LORE_SESSION=base lore promote > /dev/null
          )
        fi
        rm -rf .lore
        cp -r "${RUNNER_TEMP}/lore-base/.lore" .lore

    - name: Pull the team memory baseline
      if: inputs.hub-url != ''
      shell: bash
      env:
        HUB_URL: ${{ inputs.hub-url }}
        LORE_HUB_TOKEN: ${{ inputs.hub-token }}
        NO_COLOR: '1'
        FORCE_COLOR: '0'
      run: |
        set -euo pipefail
        if [ -z "${LORE_HUB_TOKEN}" ]; then
          echo "::error::hub-url requires hub-token so the action can read shared team memory"
          exit 1
        fi
        # Same repository id as the checked-out manifest, then merge the hub main
        # into the base store so team claims participate in drift detection.
        lore remote --hub "${HUB_URL}" --token-env LORE_HUB_TOKEN > /dev/null
        LORE_SESSION=head lore fetch

    - name: Detect memory invalidated by this pull request
      shell: bash
      env:
        NO_COLOR: '1'
        FORCE_COLOR: '0'
      run: |
        set -euo pipefail
        # Run before ingest: ingest re-observes changed files and would hide the drift.
        LORE_SESSION=head lore status --json > "${RUNNER_TEMP}/lore-status.json"

    - name: Ingest this pull request
      shell: bash
      env:
        NO_COLOR: '1'
        FORCE_COLOR: '0'
      run: |
        set -euo pipefail
        LORE_SESSION=head lore ingest > /dev/null
        LORE_SESSION=head lore diff main..agent/head --json > "${RUNNER_TEMP}/lore-diff.json"

    - name: Write the comment
      id: report
      shell: bash
      env:
        MAX_CLAIMS: ${{ inputs.max-claims }}
      run: |
        set -euo pipefail
        python3 - "${RUNNER_TEMP}/lore-status.json" "${RUNNER_TEMP}/lore-diff.json" \
          "${RUNNER_TEMP}/lore-comment.md" "${RUNNER_TEMP}/lore-metrics.txt" "${MAX_CLAIMS}" <<'PY'
        import json
        import re
        import sys

        status_path, diff_path, out_path, metrics_path, max_claims = sys.argv[1:6]
        max_claims = int(max_claims)
        with open(status_path, encoding="utf-8") as handle:
            status = json.load(handle)
        with open(diff_path, encoding="utf-8") as handle:
            diff = json.load(handle)

        added = diff.get("added") or []
        removed = diff.get("removed") or []
        stale_claims = status.get("stale_claims") or []
        stale = int(status.get("stale") or len(stale_claims))

        def taught_by_team(claim):
            return re.match(r"^(human|agent):", str(claim.get("author") or "")) is not None

        team_invalidated = [claim for claim in stale_claims if taught_by_team(claim)]
        other_invalidated = [claim for claim in stale_claims if not taught_by_team(claim)]

        def bullet(claim):
            text = f'{claim.get("id", "?")} {claim.get("subject", "?")} — {claim.get("predicate", "?")}'
            if claim.get("author"):
                text += f' ({claim["author"]})'
            return text

        lines = ["<!-- lore-memory -->", "## Lore memory", ""]
        if added or removed:
            lines.append(f"This pull request adds **{len(added)}** claim(s) and removes **{len(removed)}**.")
        else:
            lines.append("This pull request does not change what the agent knows.")
        lines.append(
            f"It invalidates **{stale}** existing claim(s); "
            f"**{len(team_invalidated)}** were taught by a teammate or agent."
        )

        if team_invalidated:
            lines += ["", "<details><summary>Invalidated team claims</summary>", ""]
            lines += [f"- {bullet(claim)}" for claim in team_invalidated[:max_claims]]
            if len(team_invalidated) > max_claims:
                lines.append(f"- ... and {len(team_invalidated) - max_claims} more")
            lines += ["", "</details>"]

        if other_invalidated:
            lines += ["", "<details><summary>Other invalidated claims</summary>", ""]
            lines += [f"- {bullet(claim)}" for claim in other_invalidated[:max_claims]]
            if len(other_invalidated) > max_claims:
                lines.append(f"- ... and {len(other_invalidated) - max_claims} more")
            lines += ["", "</details>"]

        if added:
            lines += ["", "<details><summary>Added claims</summary>", ""]
            lines += [f"- {bullet(claim)}" for claim in added[:max_claims]]
            if len(added) > max_claims:
                lines.append(f"- ... and {len(added) - max_claims} more")
            lines += ["", "</details>"]

        lines += ["", "_Generated by Lore. Approve or revert with the CLI; see docs/mcp.md._"]
        with open(out_path, "w", encoding="utf-8") as handle:
            handle.write("\n".join(lines) + "\n")
        with open(metrics_path, "w", encoding="utf-8") as handle:
            handle.write(
                f"added={len(added)}\nremoved={len(removed)}\n"
                f"stale={stale}\nteam_stale={len(team_invalidated)}\n"
            )
        PY
        cat "${RUNNER_TEMP}/lore-metrics.txt" >> "${GITHUB_OUTPUT}"

    - name: Post or update the pull request comment
      if: inputs.github-token != '' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        BODY="${RUNNER_TEMP}/lore-comment.md"
        EXISTING="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
          --jq '.[] | select(.body | contains("<!-- lore-memory -->")) | .id' | head -n1)"
        if [ -n "${EXISTING}" ]; then
          gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING}" -F "body=@${BODY}" > /dev/null
        else
          gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F "body=@${BODY}" > /dev/null
        fi

    - name: Enforce memory health
      if: inputs.strict == 'true'
      shell: bash
      run: LORE_SESSION=head lore status --strict

    - name: Clean up the worktree
      if: always()
      shell: bash
      run: git worktree remove --force "${RUNNER_TEMP}/lore-base" 2>/dev/null || true
