name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Verify before publishing
        run: |
          npm run build
          npm run typecheck
          npm run smoke
          npm run mcp:smoke

      - name: Inspect the package
        run: npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "[WARN] NPM_TOKEN is not configured; skipping npm publish."
            echo "The tarball is attached to the GitHub release instead."
            exit 0
          fi
          npm publish --provenance --access public

      - name: Build the release tarball
        run: npm pack

      - name: Attach the tarball to the release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
          generate_release_notes: true
