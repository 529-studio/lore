name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, eval, policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and typecheck
        run: npm run build && npm run typecheck

      - name: End-to-end smoke
        run: npm run smoke

      - name: MCP smoke
        run: npm run mcp:smoke

      - name: MCP concurrency (4 servers x 25 writes)
        run: npm run mcp:concurrency

      - name: Dashboard smoke
        run: npm run ui:smoke

      - name: Start postgres
        run: docker run -d --name lore-pg -e POSTGRES_PASSWORD=test -p 5432:5432 postgres:16-alpine

      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            docker exec lore-pg pg_isready -U postgres >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "postgres did not start" >&2
          exit 1

      - name: Postgres sync (two stores, concurrent pushes)
        run: npm run pg:smoke

      - name: Outcome eval (self fixture)
        run: npm run eval -- --fixtures 1

      - name: Docs budget and language
        run: npm run docs:lint

      - name: Public safety scan
        run: npm run check:public
