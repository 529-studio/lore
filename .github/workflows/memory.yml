name: Memory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory:
    name: Memory diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/lore
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ github.base_ref }}
          lore-ref: v0.4.0
          # Optional shared team memory. Set the repository variable and secret;
          # the action skips the baseline pull when hub-url is empty.
          hub-url: ${{ vars.LORE_HUB_URL }}
          hub-token: ${{ secrets.LORE_HUB_TOKEN }}
          strict: 'false'
