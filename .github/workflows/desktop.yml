name: Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the dmg to (defaults to the pushed tag)
        required: false

permissions:
  contents: write

jobs:
  macos:
    name: macOS app and dmg
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the CLI
        run: |
          npm ci
          npm run build

      - name: Build the app
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Attach the dmg to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false

  windows:
    name: Windows installer (x64)
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the CLI
        run: |
          npm ci
          npm run build

      - name: Build the installer
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Attach the installer to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
