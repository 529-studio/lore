# Support team template: answers, escalation and affected customers.
predicates:
  title:            { cardinality: one,  domain: doc }
  status:           { cardinality: one,  domain: concept }
  has_section:      { cardinality: many, domain: doc }
  section_title:    { cardinality: one,  domain: section }
  answers:          { cardinality: many, domain: concept }
  escalates_to:     { cardinality: many, domain: concept }
  affects_customer: { cardinality: many, domain: concept }
  workaround:       { cardinality: one,  domain: concept }
  resolved_by:      { cardinality: many, domain: concept }
  enforces_invariant: { cardinality: many, domain: file }
  defines_rule:     { cardinality: many, domain: doc }
  has_guardrail:    { cardinality: many, domain: doc }
  has_constraint:   { cardinality: many, domain: symbol }
  decides:          { cardinality: many, domain: adr }
  describes_issue:  { cardinality: many, domain: doc }
  defines_script:   { cardinality: many, domain: file }
  imports_module:   { cardinality: many, domain: file }
  exposes_route:    { cardinality: many, domain: file }
  read_by:          { cardinality: many, domain: env }
  uses_image:       { cardinality: many, domain: file }
  publishes_port:   { cardinality: many, domain: file }
  has_make_target:  { cardinality: many, domain: file }
  provides_command: { cardinality: many, domain: pkg }
  requires_runtime: { cardinality: many, domain: pkg }
  has_keyword:      { cardinality: many, domain: pkg }
  detects:          { cardinality: one,  domain: rule }
