<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lore — Starting…</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --line: #30363d;
      --ink: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --warn: #d29922;
      --err: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 420px;
      text-align: center;
      padding: 32px;
    }
    .logo-container {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(88, 166, 255, 0.08);
      border: 1px solid rgba(88, 166, 255, 0.2);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink);
    }
    .brand-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .progress-track {
      width: 220px;
      height: 4px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-top: 8px;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: var(--accent);
      border-radius: 99px;
      animation: indeterminate 1.4s infinite ease-in-out;
      box-shadow: 0 0 10px rgba(88, 166, 255, 0.6);
    }
    @keyframes indeterminate {
      0% { left: -45%; width: 35%; }
      50% { left: 35%; width: 55%; }
      100% { left: 100%; width: 35%; }
    }
    .status-msg {
      font-size: 12px;
      color: var(--muted);
      font-family: ui-monospace, Menlo, monospace;
    }
    .fallback-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
    }
    .fallback-msg {
      font-size: 13px;
      color: var(--warn);
      background: rgba(210, 153, 34, 0.1);
      border: 1px solid rgba(210, 153, 34, 0.3);
      border-radius: 6px;
      padding: 8px 14px;
      line-height: 1.4;
    }
    .btn-choose {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-choose:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo-container">
      <svg viewBox="0 0 512 512" width="48" height="48" fill="none">
        <rect x="88" y="88" width="64" height="336" rx="32" fill="#58a6ff"/>
        <rect x="184" y="88" width="240" height="64" rx="32" fill="#58a6ff"/>
        <rect x="184" y="224" width="184" height="64" rx="32" fill="#58a6ff" opacity="0.78"/>
        <rect x="184" y="360" width="128" height="64" rx="32" fill="#58a6ff" opacity="0.52"/>
      </svg>
    </div>
    <div>
      <div class="brand-title">Lore</div>
      <div class="brand-sub">Memory for AI Coding Agents</div>
    </div>
    <div class="progress-track" id="track">
      <div class="progress-bar"></div>
    </div>
    <div class="status-msg" id="status-text">Starting local memory engine…</div>
    <div class="fallback-box" id="fallback-box">
      <div class="fallback-msg" id="fallback-msg"></div>
      <button class="btn-choose" id="btn-choose">Choose Repository Folder…</button>
    </div>
  </div>

  <script>
    window.showFallback = function(message) {
      document.getElementById('track').style.display = 'none';
      document.getElementById('status-text').style.display = 'none';
      const box = document.getElementById('fallback-box');
      box.style.display = 'flex';
      document.getElementById('fallback-msg').textContent = message || 'Please select a repository.';
    };

    document.getElementById('btn-choose').onclick = async function() {
      try {
        const invoke = window.__TAURI__?.core?.invoke || window.__TAURI_INTERNALS__?.invoke;
        if (invoke) {
          document.getElementById('fallback-msg').textContent = 'Opening folder picker…';
          await invoke('choose_and_start');
        } else {
          document.getElementById('fallback-msg').textContent = 'Tauri IPC not connected.';
        }
      } catch (err) {
        document.getElementById('fallback-msg').textContent = 'Error: ' + err;
      }
    };
  </script>
</body>
</html>
