services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lore
      POSTGRES_DB: lore
      POSTGRES_PASSWORD: ${LORE_POSTGRES_PASSWORD:?set LORE_POSTGRES_PASSWORD in .env}
    volumes:
      - lore_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore -d lore"]
      interval: 5s
      timeout: 5s
      retries: 10

  lore-hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LORE_HUB_DATABASE_URL: postgres://lore:${LORE_POSTGRES_PASSWORD:?set LORE_POSTGRES_PASSWORD in .env}@postgres:5432/lore
      LORE_HUB_ADMIN_TOKEN: ${LORE_HUB_ADMIN_TOKEN:?set LORE_HUB_ADMIN_TOKEN in .env}
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - lore-hub
    environment:
      LORE_HUB_DOMAIN: ${LORE_HUB_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  lore_pg_data:
  caddy_data:
  caddy_config:
